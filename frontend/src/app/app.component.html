<div class="app-shell">
  <nav class="top-bar" [class.disabled]="unregisteredDialogOpen">
    <img src="logo.png" id="app-logo" alt="App Logo" class="app-logo" onclick="window.location.href='/'" />

    <div class="nav-buttons">
      <button type="button" id="upload-data-btn" (click)="openForm()">Upload data</button>
      <app-download-menu></app-download-menu>
      <span class="spacer"></span>
      <button type="button" class="info-btn" routerLink="/info">
        <mat-icon>info</mat-icon>
        <span>Info</span>
      </button>
      <button type="button" class="info-btn" (click)="basicTutorial()">
        <mat-icon>help</mat-icon>
        <span>Tutorial</span>
      </button>
    </div>
  </nav>

  <!-- zentrierter Seiteninhalt -->
  <main class="main">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <span class="footer-affiliation">
        <a href="https://www.mls.ls.tum.de/daisybio/startseite/" target="_blank" rel="noopener">Professorship for Data
          Science in Systems Biology ·
          Technical University of Munich</a>
      </span>
      <div class="footer-links">
        <a href="https://exbio.wzw.tum.de/impressum#de" target="_blank" rel="noopener">Impressum</a>
        <span class="footer-separator">/</span>
        <a href="https://exbio.wzw.tum.de/legal-notice#en" target="_blank" rel="noopener">Legal Notice</a>
        <span class="footer-separator">/</span>
        <button type="button" class="footer-privacy-link" (click)="openPrivacyPolicy()">Privacy Policy</button>
      </div>
    </div>
  </footer>

  <!-- Upload-Sidepanel -->
  <div class="sidenav" *ngIf="formsOpen">
    <app-form-page (close)="closeSidenavForms()"></app-form-page>
    <button (click)="closeSidenavForms()" class="sidenav-close-btn">
      ✕
    </button>
  </div>

  <!-- Backdrop overlay for sidenav -->
  <div class="sidenav-backdrop" *ngIf="formsOpen" (click)="closeSidenavForms()"></div>
</div>

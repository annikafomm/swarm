<div class="hexagon-plot">
<h1> Hexagon Plot </h1>

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v4.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<!-- Create an element where the map will take place -->
<svg id="hexbin_map" width="440" height="300"></svg>

<script>

// The svg
var svg = d3.select("svg"),
    width = +svg.attr("width"),
    height = +svg.attr("height");

// Map and projection
var projection = d3.geoMercator()
    .scale(350) // This is the zoom
    .translate([850, 440]); // You have to play with these values to center your map

// Load external data and boot
d3.json("/nfs/home/students/a.fomm/GitRepositories/mopitas-mapra/backend/hexagons_GSM6592049_M2.geojson", function(data){

  // Draw the map
  svg.append("g")
      .selectAll("path")
      .data(data.features)
      .enter()
      .append("path")
          .attr("fill", "#69a2a2")
          .attr("d", d3.geoPath()
              .projection(projection)
          )
          .attr("stroke", "black")

})

</script>
</div>

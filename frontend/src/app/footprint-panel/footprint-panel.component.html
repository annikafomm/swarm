<div class="footprint-panel">

  <!-- ── Section 1: Pre-computed footprints ─────────────────────── -->
  <mat-expansion-panel [expanded]="true" class="footprint-expansion-panel">
    <mat-expansion-panel-header>
      <span class="hx-title-with-info">
        Pre-computed Footprint Plots
        <button mat-icon-button type="button" class="hx-info-btn"
          [matTooltip]="infoService.getScoreInfo('footprinting') || ''" matTooltipPosition="above"
          (click)="$event.stopPropagation()">
          <mat-icon>help_outline</mat-icon>
        </button>
      </span>
    </mat-expansion-panel-header>

    <div *ngIf="footprintPlotUrls.length === 0" class="no-data">
      No pre-computed footprint plots for this dataset.
    </div>

    <div *ngFor="let url of footprintPlotUrls" class="footprint-plot">
      <iframe [src]="url" width="100%" height="500px"></iframe>
    </div>
  </mat-expansion-panel>

<div class="table-container upload-style">
  <div *ngIf="!hasData()" class="empty-message">
    {{ emptyMessage }}
  </div>

  <div *ngIf="hasData()" class="table-scroll">

    <table class="ftable">
      <thead>
        <tr>
          <th class="index-col" *ngIf="showIndexColumn">
            <div class="th-top">
              <div style="display: flex; align-items: center; flex-direction: column; gap: 2px;">
                <span
                  style="display: inline-block; overflow-wrap: break-word; word-break: normal; min-width: 100px; hyphens: none;">{{ indexColumnLabel }}</span>
                <input class="input" [(ngModel)]="filters['index']" placeholder="Type to filter..." />
              </div>
              <span class="sort-icons">
                <button class="btn-ghost icon" (click)="setSort('index', true)" aria-label="sort ascending">
                  ▲
                </button>
                <button class="btn-ghost icon" (click)="setSort('index', false)" aria-label="sort descending">
                  ▼
                </button>
              </span>
            </div>

          </th>

          <th *ngFor="let col of columns" class="other-col">
            <div class="th-top">
              <span class="hx-title-with-info"
                style="display: inline-flex; overflow-wrap: break-word; word-break: normal; hyphens: none;">
                {{ col | translate | async }}
                <button *ngIf="infoService.getColumnInfo(col)" mat-icon-button type="button" class="hx-info-btn"
                  [matTooltip]="infoService.getColumnInfo(col) || ''" matTooltipPosition="above">
                  <mat-icon>help_outline</mat-icon>
                </button>
              </span>
              <span class="sort-icons">
                <button class="btn-ghost icon" (click)="setSort(col, true)">
                  ▲
                </button>
                <button class="btn-ghost icon" (click)="setSort(col, false)">
                  ▼
                </button>
              </span>
              <input *ngIf="isSearchableColumn(col)" class="input" [(ngModel)]="filters[col]"
                placeholder="Type to filter..." />
            </div>
          </th>
          <th *ngFor="let action of availableActionColumns" class="action-col">
            {{ action === 'show_on_plot' ? 'Show on plot' : (action | translate | async) }}
          </th>
        </tr>
      </thead>

      <!-- <tbody>
        <tr *ngFor="let row of pagedRows">
          <td class="index-col">{{ truncateMiddle(row.index) }}</td>

          <td *ngFor="let col of columns" class="other-col">
            {{ displayNumeric(row[col]) }}
          </td>

          <td *ngFor="let action of actionColumns" class="action-col"> -->
            <!-- Checkbox column -->
            <!-- <ng-container *ngIf="action === 'Sum_chromvar_spot_scores'; else showBtn">
              <input
                type="checkbox"
                [checked]="isSumSelected(row)"
                (change)="toggleSumMotif(row, $any($event.target).checked)" />
            </ng-container> -->

            <!-- Show button column -->
            <!-- <ng-template #showBtn>
              <button
                class="btn btn-pill"
                (click)="fetchAndUpdate(action, action === 'chromvar_spot_scores' ? row.motif_id : row.index)">
                Show
              </button>
            </ng-template>
          </td>
        </tr>
      </tbody> -->
      <tbody>
        <tr *ngFor="let row of pagedRows">
          <td class="index-col" *ngIf="showIndexColumn" [title]="indexTitle(row.index)">{{ displayIndex(row.index) }}</td>

          <td *ngFor="let col of columns" class="other-col">
            {{ displayNumeric(row[col]) }}
          </td>

          <td *ngFor="let action of availableActionColumns" class="action-col">
            <!-- ChromVAR: Show button + checkbox for summing -->
            <ng-container *ngIf="action === 'chromvar_spot_scores'; else showBtn">
              <button class="btn btn-pill" (click)="onShowAction(action, row)">Show</button>
              <input
                type="checkbox"
                [checked]="isSumSelected(row)"
                (change)="toggleSumMotif(row, $any($event.target).checked)"
                title="Add to sum" />
            </ng-container>

            <!-- Other action columns: row-level Show button -->
            <ng-template #showBtn>
              <button class="btn btn-pill" (click)="onShowAction(action, row)">
                Show
              </button>
            </ng-template>
          </td>
        </tr>
      </tbody>


    </table>
  </div>
</div>
<br />

<!-- Pagination controls -->
<div *ngIf="hasData()" class="pagination">
  <button class="btn btn-pill" (click)="setPage(currentPage - 1)" [disabled]="currentPage === 1">
    Prev
  </button>
  <span>Page {{ currentPage }} of {{ totalPages }}</span>
  <button class="btn btn-pill" (click)="setPage(currentPage + 1)" [disabled]="currentPage === totalPages">
    Next
  </button>
</div>

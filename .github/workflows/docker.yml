name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from the GitHub UI (builds both images)

jobs:
  # Only build the images a push touches: a frontend change doesn't rebuild the backend and vice versa
  changes:
    name: Find changed images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile.backend'
              - 'docker_environment.yml'
              - 'tangram.yml'
              - '.dockerignore'
            frontend:
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'nginx.conf'
              - '.dockerignore'

  # Both images build in parallel. Layers are cached in the registry (:buildcache), so a code
  # change only rebuilds the layers after the changed files, not the conda / npm installs.
  build-backend:
    name: Build & push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/daisybio/swarm-backend:latest
          provenance: false   # plain image as before, no attestation manifest
          cache-from: type=registry,ref=ghcr.io/daisybio/swarm-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/daisybio/swarm-backend:buildcache,mode=max

  build-frontend:
    name: Build & push frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/daisybio/swarm-frontend:latest
          provenance: false   # plain image as before, no attestation manifest
          cache-from: type=registry,ref=ghcr.io/daisybio/swarm-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/daisybio/swarm-frontend:buildcache,mode=max

name: base
channels:
  - conda-forge
  - bioconda
  - r
dependencies:
  # --- Core R version ---
  - r-base=4.5.1

  # --- CRAN packages you explicitly load ---
  - r-matrix=1.7_4
  - r-data.table=1.17.8
  - r-jsonlite=2.0.0
  - r-optparse
  - r-dplyr=1.1.4
  - r-tibble=3.3.0
  - r-patchwork=1.3.2
  - r-ggplot2  # conda-forge currently has 4.0.0; your R lib shows 4.0.1

  # --- Single-cell stack (conda packages exist) ---
  - r-seurat=5.3.1     
  - r-seuratobject=5.2.0
  - r-signac=1.16.0            



  # --- Bioconductor packages you load ---
  - bioconductor-gsva
  - bioconductor-aucell
  - bioconductor-jaspar2024=0.99.7
  - bioconductor-tfbstools=1.46.0
  - bioconductor-bsgenome-hsapiens-ucsc-hg38=1.4.5

  # --- Optional but commonly needed for this ecosystem ---
  - r-devtools
  - r-remotes
  - r-renv
  - r-tidyverse
  - r-biocmanager
  - r-domc

  # --- Helpful system libs for compilation / graphics ---
  # - gcc
  # - gxx
  # - make
  # - pkg-config
  # - cairo
  # - pango
  # - harfbuzz
  # - freetype

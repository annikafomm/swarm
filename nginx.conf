server {
    listen 80;

    proxy_http_version   1.1;
    proxy_set_header     Host              $host;
    proxy_set_header     X-Real-IP         $remote_addr;
    proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header     X-Forwarded-Proto $scheme;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;
    client_max_body_size 5000m;

    # /api/ prefixed routes
    location /api/ {
        proxy_pass http://swarm-backend:3000;
    }

    # Non-prefixed backend routes (single-line regex required by nginx)
    location ~ ^/(create_session|delete_session|reset_session|whoami|read_adata|download_adata|read_network_genie|read_network_sponge|geneset_connections_genie|geneset_connections_sponge|obs|var|obsm|X|X_stats|health) {
        proxy_pass http://swarm-backend:3000;
    }

    # Angular SPA — must be last
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
